services:
  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=llm_user
      - POSTGRES_PASSWORD=llm_password
      - POSTGRES_DB=litellm_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  litellm:
    image: docker.litellm.ai/berriai/litellm:main-stable
    ports:
      - "4000:4000"
    volumes:
      # LITELLM_CONFIG_PATH lets a caller (e.g. run_adk_eval.py) point this
      # at a dedicated config - eval/adk/litellm.ci.yaml - instead of
      # whatever provider/model this developer's own .env last configured
      # via setup_llm.py, so eval runs are reproducible regardless of the
      # local dev environment's drift. Unset, this is unchanged from before.
      - ${LITELLM_CONFIG_PATH:-./litellm.yaml}:/app/config.yaml:ro
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      # Only needed if litellm.yaml is swapped for one of the
      # config/model-templates/litellm.cloud-*.yaml provider templates.
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      - DATABASE_URL=${DATABASE_URL}
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    depends_on:
      - db
    restart: unless-stopped

  agent:
    build:
      context: .
      dockerfile: agent.Dockerfile
    ports:
      # ADK web frontend (only listens when AGENT_MODE=web, the default)
      - "8000:8000"
    volumes:
      # Mount the agent's source code as read-only
      - ./agents:/app/agents:ro
      - ./spec-templates:/app/spec-templates:ro
      - ./eval:/app/eval:ro
      # GH issue #156: `adk eval` writes its own local run-history bookkeeping
      # to <agents_dir>/<app_name>/.adk/eval_history (google/adk/evaluation/
      # local_eval_set_results_manager.py) - here, eval/adk/agent/scrum_team/
      # .adk - which the read-only mount above blocks ("Read-only file
      # system"). A named volume nested inside that read-only mount point
      # still gets its own independent, writable mount (Compose/Docker apply
      # mounts as separate mount-namespace entries), without making the rest
      # of the eval/ tree (scenario/eval-set source the agent under test must
      # not be able to tamper with) writable. Not a host bind mount: this is
      # pure ADK-internal bookkeeping nobody needs to inspect on the host, and
      # a host path that doesn't exist yet is a known Windows Docker Desktop
      # footgun (see STATE_REPO_PATH's mkdir-first handling elsewhere).
      - adk_eval_history:/app/eval/adk/agent/scrum_team/.adk
      # Mount the state repository as read-write
      - type: bind
        source: ${STATE_REPO_PATH}
        target: /app/state_repo
      # Mount the sessions directory to persist conversation history
      - ./sessions:/app/sessions
      # Scratch space for the team-performance eval harness (run_eval.py /
      # run_eval_analysis.py) to write its clone + report where the host
      # (and CI's artifact-upload step) can read them back.
      - ./eval-output:/app/eval-output
    environment:
      - AGENT_MODE=${AGENT_MODE:-web}
      - STATE_REPO_PATH=${STATE_REPO_PATH}
      - INTERNAL_STATE_REPO_PATH=/app/state_repo
      - LITELLM_PROXY_API_BASE=http://litellm:4000
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      - LITELLM_PROXY_API_KEY=${LITELLM_PROXY_API_KEY}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - GITHUB_REPO_URL=${GITHUB_REPO_URL}
      # GH issue #82: Compose prints a "variable is not set" warning for any
      # bare ${VAR} reference left unset in .env, even when the code being
      # run already has a perfectly good default for it (get_interaction_level(),
      # _default_push_branch(), etc.) - inline `:-default` here matches those
      # same code-side defaults exactly, so the warning only fires for a var
      # that's genuinely required with no safe fallback.
      - GITHUB_REPO_BRANCH=${GITHUB_REPO_BRANCH:-main}
      - GITHUB_APP_ID=${GITHUB_APP_ID}
      - GITHUB_APP_PRIVATE_KEY=${GITHUB_APP_PRIVATE_KEY}
      - GITHUB_APP_INSTALLATION_ID=${GITHUB_APP_INSTALLATION_ID}
      - SPRINT_TOKEN_BUDGET=${SPRINT_TOKEN_BUDGET:-1000000}
      # TOTAL_USD_BUDGET is the canonical name (GH issue #81); SPRINT_USD_BUDGET
      # is still passed through so an existing .env using the older name keeps
      # working via get_env_with_deprecated_fallback. The `:-` (empty, not a
      # real value) on both is deliberate: get_env_with_deprecated_fallback
      # needs to see each one genuinely absent (empty string, falsy) to know
      # to check the other - a real inline default here (like the vars above)
      # would inject a value into TOTAL_USD_BUDGET even when only the
      # deprecated name was actually configured, permanently hiding it
      # (GH issue #82 - this empty default exists purely to silence Compose's
      # own warning, not to change what value is actually used).
      - TOTAL_USD_BUDGET=${TOTAL_USD_BUDGET:-}
      - SPRINT_USD_BUDGET=${SPRINT_USD_BUDGET:-}
      - PROCESS_OVERHEAD_PERCENTAGE=${PROCESS_OVERHEAD_PERCENTAGE:-10.0}
      # Per-sprint config for agents/scrum_team/scripts/run_eval.py - see
      # .env.example's "Eval Harness Budget Configuration" section. No inline
      # default here (unlike the vars above) - run_eval.py's own
      # parser.error() deliberately requires these explicitly when the eval
      # harness actually runs, rather than silently falling back to a value
      # calibrated for a different purpose.
      - EVAL_SPRINT_TOKEN_BUDGET=${EVAL_SPRINT_TOKEN_BUDGET}
      # Same deprecated-name pair as TOTAL_USD_BUDGET/SPRINT_USD_BUDGET above -
      # `:-` (empty) only, not a real default, so run_eval.py's own
      # get_env_with_deprecated_fallback still sees each one genuinely absent.
      - EVAL_USD_BUDGET_PER_SPRINT=${EVAL_USD_BUDGET_PER_SPRINT:-}
      - EVAL_SPRINT_USD_BUDGET=${EVAL_SPRINT_USD_BUDGET:-}
      - SESSION_ID=${SESSION_ID:-my-sprint}
      # GH issue #125: the commit of this Horseless Carriage checkout that
      # produced an eval run, recorded in the run manifest/report so results
      # are comparable across HC commits/fixes over time. `.git` is excluded
      # from the agent image's build context (.dockerignore, GH issue #123),
      # so this must be computed on the host (`git rev-parse HEAD`) and
      # passed through - empty default only, run_eval.py's own manifest
      # field falls back to "unknown" when this is genuinely unset.
      - HC_COMMIT_SHA=${HC_COMMIT_SHA:-}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - GIT_USER_NAME=${GIT_USER_NAME}
      - GIT_USER_EMAIL=${GIT_USER_EMAIL}
      - LLM_LOCAL_PROVIDER=false
      # GH issue #76: Docker Compose only passes variables explicitly listed
      # here into the container - it does NOT forward the rest of the host's
      # .env automatically, however plausible that might look. These three
      # were configurable in .env/setup_llm.py but silently never reached
      # the agent process, always reading back as unset/default regardless
      # of what was actually configured.
      - INTERACTION_LEVEL=${INTERACTION_LEVEL:-Product}
      - GITHUB_DEVELOP_BRANCH=${GITHUB_DEVELOP_BRANCH:-develop}
      - NOTIFICATION_PLUGINS=${NOTIFICATION_PLUGINS:-console}
      - TRANSCRIPT_MAX_ENTRIES=${TRANSCRIPT_MAX_ENTRIES:-200}
      - TARGET_STORIES_PER_SPRINT=${TARGET_STORIES_PER_SPRINT:-3}
      - READY_BACKLOG_SPRINTS_TARGET=${READY_BACKLOG_SPRINTS_TARGET:-2}
    depends_on:
      - litellm
    # Keep the container running and allow for interactive sessions
    stdin_open: true
    tty: true
    command: ["/bin/bash", "/app/agents/scrum_team/scripts/run_agent.sh"]

  # -----------------------------------------
  # For a fully local, no-commercial-LLM setup (self-hosted Ollama instead of
  # Gemini/OpenAI/Anthropic), use docker-compose.local.yaml instead of this
  # file: `docker compose -f docker-compose.local.yaml up`. See
  # config/model-templates/litellm.local-ollama.yaml for the model mapping.
  # -----------------------------------------

volumes:
  postgres_data:
  adk_eval_history:
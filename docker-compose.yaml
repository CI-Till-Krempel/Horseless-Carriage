services:
  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=llm_user
      - POSTGRES_PASSWORD=llm_password
      - POSTGRES_DB=litellm_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  litellm:
    image: docker.litellm.ai/berriai/litellm:main-stable
    ports:
      - "4000:4000"
    volumes:
      - ./litellm.yaml:/app/config.yaml:ro
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      - DATABASE_URL=${DATABASE_URL}
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    depends_on:
      - db

  agent:
    build:
      context: .
      dockerfile: agent.Dockerfile
    volumes:
      # Mount the agent's source code as read-only
      - ./agents:/app/agents:ro
      # Mount the state repository as read-write
      - type: bind
        source: ${STATE_REPO_PATH}
        target: /app/state_repo
    environment:
      - STATE_REPO_PATH=/app/state_repo
      - LITELLM_PROXY_API_BASE=http://litellm:4000
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - LITELLM_PROXY_API_KEY=${LITELLM_PROXY_API_KEY}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
    depends_on:
      - litellm
    # Keep the container running and allow for interactive sessions
    stdin_open: true
    tty: true

  # -----------------------------------------
  # OPTIONAL (later): Ollama for local models
  # -----------------------------------------
  # ollama:
  #   image: ollama/ollama:latest
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ollama:/root/.ollama

volumes:
  postgres_data:
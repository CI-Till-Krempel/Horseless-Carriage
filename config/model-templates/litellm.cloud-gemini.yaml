# "Cloud" model template - extracted from the setup active in the root
# litellm.yaml today. Every scrum-team role is served by Google Gemini via a
# commercial API key (GOOGLE_API_KEY). This file is a reference copy for
# comparison with config/model-templates/litellm.local-ollama.yaml; the file
# actually mounted by the default docker-compose.yaml is still the root
# litellm.yaml.
model_list:
  - model_name: scrum-orchestrator
    litellm_params:
      model: gemini/gemini-1.5-pro
      api_key: os.environ/GOOGLE_API_KEY
      safety_settings:
        - category: HARM_CATEGORY_HARASSMENT
          threshold: BLOCK_NONE
        - category: HARM_CATEGORY_HATE_SPEECH
          threshold: BLOCK_NONE
        - category: HARM_CATEGORY_SEXUALLY_EXPLICIT
          threshold: BLOCK_NONE
        - category: HARM_CATEGORY_DANGEROUS_CONTENT
          threshold: BLOCK_NONE


# GH issue #287: tinyproxy config for the net-proxy sidecar. The `agent`
# container has no route to the internet at all except through this proxy
# (see docker-compose*.yaml's `agent-net` - internal: true) - this file is
# the actual enforcement point for "which hosts can it reach."
User nobody
Group nobody
Port 8888
Listen 0.0.0.0
Timeout 600
DisableViaHeader Yes
LogLevel Info

# Allowlist-only: anything not matching allowlist.filter below is denied,
# for both plain HTTP requests and HTTPS CONNECT tunnels (git/gh only ever
# need HTTPS to github.com/api.github.com - see allowlist.filter).
FilterDefaultDeny Yes
Filter "/etc/tinyproxy/allowlist.filter"
FilterExtended Yes
FilterCaseSensitive No

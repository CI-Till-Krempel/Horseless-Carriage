  # -----------------------------------------
  # Team performance evaluation harness (see RELEASE.md, run_eval.py)
  # A single cheap/fast alias every role is pointed at during an automated
  # eval run (via the SCRUM_<ROLE>_MODEL env override in get_model_name),
  # to keep a 5-sprint run's real cost small. Reuses GOOGLE_API_KEY - no
  # separate secret needed.
  # -----------------------------------------
  - model_name: scrum-eval-cheap
    litellm_params:
      model: gemini/gemini-flash-lite-latest
      api_key: os.environ/GOOGLE_API_KEY
      safety_settings:
        - category: HARM_CATEGORY_HARASSMENT
          threshold: BLOCK_NONE
        - category: HARM_CATEGORY_HATE_SPEECH
          threshold: BLOCK_NONE
        - category: HARM_CATEGORY_SEXUALLY_EXPLICIT
          threshold: BLOCK_NONE
        - category: HARM_CATEGORY_DANGEROUS_CONTENT
          threshold: BLOCK_NONE


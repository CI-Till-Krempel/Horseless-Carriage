name: ADK Gate-Enforcement Eval

on:
  push:
    tags:
      - "v*.*.*"
  # Runs on every PR too, not just release tags - this is the whole point of
  # it being ~10 short, cheap-model, scripted single/few-turn conversations
  # (see adk_eval_command's KNOWN_FLAKY_EVAL_IDS exclusion below for how it
  # stays non-blocking-flake-free as a required PR gate): catching a
  # gate-enforcement regression at PR time is far cheaper than catching it at
  # release-tag time. A PR opened from a fork never sees this job's secrets
  # (GitHub Actions withholds environment/repo secrets from fork-triggered
  # pull_request runs by design) - the job still runs, it just fails fast at
  # the LiteLLM-not-ready step instead of silently skipping, which is
  # acceptable here since this repo's actual contribution flow is
  # same-repo branches, not forks.
  #
  # types adds labeled/unlabeled to the pull_request default (opened,
  # synchronize, reopened) - see the "Check for NO_ADK_EVAL label" step
  # below: applying/removing that label after the PR already has commits
  # must re-evaluate this job without requiring an empty commit to nudge it.
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch: {}

# Cancel a still-running eval for an older push to the same PR - this job
# spins up real Docker services and spends real Gemini tokens per run, so a
# developer pushing 3 times in a minute shouldn't pay for 3 full runs when
# only the latest commit's result matters. Release-tag/workflow_dispatch
# runs (no pull_request number) always get a unique group, so cancellation
# never touches those.
concurrency:
  group: adk-eval-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  adk-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Unlike eval.yml's multi-sprint team-performance harness (real spend
    # across 5 sprints, gated behind a maintainer-approved "eval-approval"
    # environment), this eval set is ~10 short, scripted single/few-turn
    # conversations against a cheap Gemini model (eval/adk/litellm.ci.yaml)
    # - cheap and fast enough to run automatically on every release tag (and
    # every PR, see the `on:` block above) as a regression gate, with no
    # manual approval step. Still uses its own "adk-eval" environment
    # (created with zero protection rules, unlike "eval-approval") rather
    # than repo-level secrets, purely to scope GOOGLE_API_KEY/
    # LITELLM_MASTER_KEY to this one workflow instead of exposing them
    # repo-wide.
    environment: adk-eval
    steps:
      - uses: actions/checkout@v4

      # NO_ADK_EVAL label: for PRs that don't touch agents/scrum_team/ at
      # all (docs, host-only scripts/dashboard, setup/env templates, CI/
      # infra config) - see AGENTS.md section 9, which explains exactly
      # which changes DO require this eval. Applying the label skips the
      # two steps below but the job still runs and reports success (not
      # skipped-at-the-job-level), so a required-status-check branch
      # protection rule never gets stuck pending on a PR that opted out.
      # github.event.pull_request is only present on pull_request-triggered
      # runs - push (release tag)/workflow_dispatch always run for real.
      - name: Check for NO_ADK_EVAL label
        id: label_check
        run: |
          echo "skip=${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'NO_ADK_EVAL') }}" >> "$GITHUB_OUTPUT"

      - name: Skipped - NO_ADK_EVAL label present
        if: steps.label_check.outputs.skip == 'true'
        run: echo "This PR has the NO_ADK_EVAL label (no agents/scrum_team/ changes) - skipping the eval run. See AGENTS.md section 9 before relying on this label for a change that touches agent tools/prompts/gates."

      - name: Write eval environment file
        if: steps.label_check.outputs.skip != 'true'
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          LITELLM_MASTER_KEY: ${{ secrets.LITELLM_MASTER_KEY }}
        run: |
          {
            echo "GOOGLE_API_KEY=$GOOGLE_API_KEY"
            echo "LITELLM_MASTER_KEY=$LITELLM_MASTER_KEY"
            # ScrumOrchestrator is deliberately never given a per-agent
            # virtual key (see run_adk_eval.py's _SPECIALIST_AGENT_NAMES) -
            # its own model calls authenticate to the proxy via
            # LITELLM_PROXY_API_KEY instead (agent.py's fallback-key guard).
            # Without this, every orchestrator call fails with "Missing
            # credentials" after 7 retries and all eval cases fail before a
            # single real turn happens. Reusing the master key here is the
            # documented convention (.env.example: "<any_value_or_master_key>")
            # - the proxy's general_settings.master_key accepts it as a
            # valid bearer token for any request.
            echo "LITELLM_PROXY_API_KEY=$LITELLM_MASTER_KEY"
            # GH issue #240: docker-compose.yaml's db service now reads
            # POSTGRES_PASSWORD via Compose-level ${...} interpolation
            # instead of hardcoding it - this ephemeral CI-only database
            # still needs some value for the two to match, so both are
            # written here rather than sourced from a real secret.
            echo "POSTGRES_PASSWORD=llm_password"
            echo "DATABASE_URL=postgresql://llm_user:llm_password@db:5432/litellm_db"
            echo "SESSION_ID=adk-eval-${{ github.run_number }}"
          } > .env.adk-eval
          # No STATE_REPO_PATH here - run_adk_eval.py always overrides it
          # with its own scratch repo (prepare_scratch_state_repo), never
          # whatever this env file says.

      - name: Run ADK gate-enforcement eval set
        if: steps.label_check.outputs.skip != 'true'
        # --debug: unlike an interactive local run (where it just floods the
        # shell), a CI run's log is only read after the fact, and only when
        # diagnosing a failure - the app's own debug logging is worth having
        # by default here. This deliberately does NOT also set
        # LITELLM_LOG_VERBOSE=1 - that raw provider wire-level trace (full
        # system prompt + tool schema list dumped 2-3x per call) is what
        # ballooned a past run's log into double-digit megabytes for a
        # handful of calls, with none of it actually needed to diagnose that
        # failure (a plain ERROR-level traceback had the real signal). Set
        # LITELLM_LOG_VERBOSE=1 in .env.adk-eval above for one re-run if a
        # future failure genuinely needs the exact model payload.
        run: python3 run_adk_eval.py --ci --debug --env-file .env.adk-eval

      # Belt-and-suspenders backstop: run_adk_eval.py already tears the
      # stack down itself (even on failure, via its own try/finally) - this
      # only catches the case where the job got killed/cancelled before that
      # finally block could run at all.
      - name: Stop dependency services (backstop)
        if: always() && steps.label_check.outputs.skip != 'true'
        run: docker compose -p horseless-carriage-eval --env-file .env.adk-eval down -v

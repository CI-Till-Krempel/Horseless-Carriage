name: ADK Gate-Enforcement Eval

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

jobs:
  adk-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Unlike eval.yml's multi-sprint team-performance harness (real spend
    # across 5 sprints, gated behind a maintainer-approved "eval-approval"
    # environment), this eval set is ~10 short, scripted single/few-turn
    # conversations against a cheap Gemini model (eval/adk/litellm.ci.yaml)
    # - cheap and fast enough to run automatically on every release tag as a
    # regression gate, with no manual approval step. Still uses its own
    # "adk-eval" environment (created with zero protection rules, unlike
    # "eval-approval") rather than repo-level secrets, purely to scope
    # GOOGLE_API_KEY/LITELLM_MASTER_KEY to this one workflow instead of
    # exposing them repo-wide.
    environment: adk-eval
    steps:
      - uses: actions/checkout@v4

      - name: Write eval environment file
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          LITELLM_MASTER_KEY: ${{ secrets.LITELLM_MASTER_KEY }}
        run: |
          {
            echo "GOOGLE_API_KEY=$GOOGLE_API_KEY"
            echo "LITELLM_MASTER_KEY=$LITELLM_MASTER_KEY"
            # ScrumOrchestrator is deliberately never given a per-agent
            # virtual key (see run_adk_eval.py's _SPECIALIST_AGENT_NAMES) -
            # its own model calls authenticate to the proxy via
            # LITELLM_PROXY_API_KEY instead (agent.py's fallback-key guard).
            # Without this, every orchestrator call fails with "Missing
            # credentials" after 7 retries and all eval cases fail before a
            # single real turn happens. Reusing the master key here is the
            # documented convention (.env.example: "<any_value_or_master_key>")
            # - the proxy's general_settings.master_key accepts it as a
            # valid bearer token for any request.
            echo "LITELLM_PROXY_API_KEY=$LITELLM_MASTER_KEY"
            echo "DATABASE_URL=postgresql://llm_user:llm_password@db:5432/litellm_db"
            echo "SESSION_ID=adk-eval-${{ github.run_number }}"
          } > .env.adk-eval
          # No STATE_REPO_PATH here - run_adk_eval.py always overrides it
          # with its own scratch repo (prepare_scratch_state_repo), never
          # whatever this env file says.

      - name: Run ADK gate-enforcement eval set
        # --debug: unlike an interactive local run (where it just floods the
        # shell), a CI run's log is only read after the fact, and only when
        # diagnosing a failure - the app's own debug logging is worth having
        # by default here. This deliberately does NOT also set
        # LITELLM_LOG_VERBOSE=1 - that raw provider wire-level trace (full
        # system prompt + tool schema list dumped 2-3x per call) is what
        # ballooned a past run's log into double-digit megabytes for a
        # handful of calls, with none of it actually needed to diagnose that
        # failure (a plain ERROR-level traceback had the real signal). Set
        # LITELLM_LOG_VERBOSE=1 in .env.adk-eval above for one re-run if a
        # future failure genuinely needs the exact model payload.
        run: python3 run_adk_eval.py --ci --debug --env-file .env.adk-eval

      # Belt-and-suspenders backstop: run_adk_eval.py already tears the
      # stack down itself (even on failure, via its own try/finally) - this
      # only catches the case where the job got killed/cancelled before that
      # finally block could run at all.
      - name: Stop dependency services (backstop)
        if: always()
        run: docker compose -p horseless-carriage-eval --env-file .env.adk-eval down -v

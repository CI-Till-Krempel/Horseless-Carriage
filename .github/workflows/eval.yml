name: Team Performance Evaluation

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      branch:
        description: "Horseless Carriage branch/ref to evaluate"
        required: false
        default: "main"
      sprints:
        description: "Number of sprints to run"
        required: false
        default: "5"

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Real LLM spend per run - require a maintainer to approve before the
    # job actually executes, regardless of trigger (tag push or manual
    # dispatch). See RELEASE.md "Team performance evaluation" and set up
    # the "eval-approval" environment's required reviewers in repo
    # Settings -> Environments.
    environment: eval-approval
    # GH issue #125: the "Tag commit with run id" step below pushes a new
    # tag, which needs write access to repo contents - the default token
    # permissions for this repo may otherwise be read-only.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}

      - name: Compute run id
        id: run_id
        run: |
          VERSION=$(cat VERSION)
          RUN_ID="${VERSION}-run${{ github.run_number }}"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          # GitFlow: run_eval.py bootstraps both eval/$RUN_ID/main and
          # eval/$RUN_ID/develop (the latter derived internally from
          # --run-id) - this is the run's main, where sprint PRs land and
          # what the final human-review overview PR is opened from.
          echo "branch=eval/$RUN_ID/main" >> "$GITHUB_OUTPUT"
          # GH issue #125: the exact HC commit this run evaluates, recorded
          # in the run manifest/report (via HC_COMMIT_SHA below) and tagged
          # below so results are comparable across HC commits/fixes over
          # time, not just across eval-repo branches.
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Write eval environment file
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          LITELLM_MASTER_KEY: ${{ secrets.LITELLM_MASTER_KEY }}
          EVAL_GITHUB_APP_ID: ${{ secrets.EVAL_GITHUB_APP_ID }}
          EVAL_GITHUB_APP_PRIVATE_KEY: ${{ secrets.EVAL_GITHUB_APP_PRIVATE_KEY }}
          EVAL_GITHUB_APP_INSTALLATION_ID: ${{ secrets.EVAL_GITHUB_APP_INSTALLATION_ID }}
        run: |
          mkdir -p /tmp/hc-eval-state-scratch eval-output
          # A .env file must be one KEY=VALUE per line, but a GitHub App
          # private key is a multi-line PEM. Collapse any real newlines in
          # the secret into literal "\n" first - agents/scrum_team/tools/
          # base.py's _normalize_private_key converts them back to real
          # newlines at runtime (same convention as .env.example). This is
          # idempotent if the secret was already stored with escaped \n.
          PRIVATE_KEY_SINGLE_LINE=$(printf '%s' "$EVAL_GITHUB_APP_PRIVATE_KEY" | sed ':a;N;$!ba;s/\n/\\n/g')
          {
            echo "GOOGLE_API_KEY=$GOOGLE_API_KEY"
            echo "LITELLM_MASTER_KEY=$LITELLM_MASTER_KEY"
            echo "DATABASE_URL=postgresql://llm_user:llm_password@db:5432/litellm_db"
            echo "GITHUB_APP_ID=$EVAL_GITHUB_APP_ID"
            echo "GITHUB_APP_PRIVATE_KEY=$PRIVATE_KEY_SINGLE_LINE"
            echo "GITHUB_APP_INSTALLATION_ID=$EVAL_GITHUB_APP_INSTALLATION_ID"
            echo "STATE_REPO_PATH=/tmp/hc-eval-state-scratch"
            echo "GIT_USER_NAME=Horseless Carriage Eval Harness"
            echo "GIT_USER_EMAIL=eval@horseless-carriage.local"
            echo "SESSION_ID=eval-${{ steps.run_id.outputs.run_id }}"
            echo "HC_COMMIT_SHA=${{ steps.run_id.outputs.commit_sha }}"
            echo "LOG_LEVEL=info"
            # docker-compose.yaml's agent service always sets
            # PROCESS_OVERHEAD_PERCENTAGE=${PROCESS_OVERHEAD_PERCENTAGE} - if this
            # .env file doesn't define it, Compose substitutes an *empty string*,
            # not "unset", so get_process_overhead_percentage()'s os.getenv(...,
            # "10.0") default never kicks in and float("") crashes the run.
            echo "PROCESS_OVERHEAD_PERCENTAGE=20"
            # Mirrors .env.example's "Eval Harness Budget Configuration" -
            # override via repo/environment Settings -> Variables if these
            # ever need recalibrating without a code change. GH issue #81:
            # 2,600,000 was too tight for later, more complex sprints (a real
            # run hit ~2.8M and truncated sprints 4-5) - bumped with headroom.
            # 0.1.0-run25 then hit 4,072,826 in sprint 1 alone (see
            # ISSUE-0045) - bumped again with real headroom above that.
            echo "EVAL_SPRINT_TOKEN_BUDGET=${{ vars.EVAL_SPRINT_TOKEN_BUDGET || '5000000' }}"
            echo "EVAL_USD_BUDGET_PER_SPRINT=${{ vars.EVAL_USD_BUDGET_PER_SPRINT || '3.0' }}"
            # ISSUE-0045: this fixed scenario's entire product backlog is 6
            # stories - the default READY_BACKLOG_SPRINTS_TARGET=2 (see
            # helpers.py) times TARGET_STORIES_PER_SPRINT=3 demands exactly 6
            # Ready stories before Sprint 1's backlog can even be published,
            # forcing 100% of the requirements engineering for the whole
            # product into a single pre-Sprint-1 burst (0.1.0-run25 spent
            # 1.5M of its 4M sprint-1 token budget there, on ProductOwner
            # alone, before any code was written). Scoped to this workflow's
            # isolated eval container only, not the real-usage default in
            # docker-compose.yaml/.local.yaml/.local-hostollama.yaml - a
            # 2-sprint Ready buffer is still the right call for a real
            # engagement with an open-ended backlog.
            echo "READY_BACKLOG_SPRINTS_TARGET=${{ vars.READY_BACKLOG_SPRINTS_TARGET || '1' }}"
          } > .env.eval

      - name: Start dependency services
        run: |
          docker compose --env-file .env.eval up -d db litellm
          until curl -sf http://localhost:4000/health/readiness > /dev/null; do
            echo "Waiting for litellm..."
            sleep 2
          done

      - name: Run evaluation sprints and analysis
        run: |
          docker compose --env-file .env.eval run --rm agent bash -c '
            set -e
            python3 -m agents.scrum_team.scripts.run_eval \
              --sprints "${{ github.event.inputs.sprints || 5 }}" \
              --run-id "${{ steps.run_id.outputs.run_id }}" \
              --branch "${{ steps.run_id.outputs.branch }}" \
              --local-path /app/eval-output/clone \
              --report-path /app/eval-output/manifest.json \
              --transcript-path /app/eval-output/transcript.md
            python3 -m agents.scrum_team.scripts.run_eval_analysis \
              --manifest /app/eval-output/manifest.json \
              --repo-path /app/eval-output/clone \
              --report-path /app/eval-output/report.md \
              --run-id "${{ steps.run_id.outputs.run_id }}" \
              --base-branch "${{ steps.run_id.outputs.branch }}"
          '

      - name: Tag commit with run id
        if: always()
        run: |
          TAG="eval-${{ steps.run_id.outputs.run_id }}"
          git tag "$TAG" "${{ steps.run_id.outputs.commit_sha }}"
          git push origin "$TAG"

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report-${{ steps.run_id.outputs.run_id }}
          path: |
            eval-output/report.md
            eval-output/manifest.json
            eval-output/transcript.md
          retention-days: 90

      - name: Stop dependency services
        if: always()
        run: docker compose --env-file .env.eval down -v

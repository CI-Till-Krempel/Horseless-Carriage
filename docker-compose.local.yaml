# Fully local stack: extends docker-compose.yaml's db + litellm + agent setup
# with a self-hosted Ollama container, so every model call is served locally
# instead of by a commercial API. No OPENAI_API_KEY / ANTHROPIC_API_KEY /
# GOOGLE_API_KEY required - see .env.local.example.
#
# Run standalone (do not combine with docker-compose.yaml - the litellm
# service targets a different config file):
#   cp .env.local.example .env   # or edit your existing .env
#   docker compose -f docker-compose.local.yaml up
# For NVIDIA GPU acceleration, merge in docker-compose.gpu.yaml instead of
# hand-editing this file (see docs/SETUP.md's "GPU Support" section):
#   docker compose -f docker-compose.local.yaml -f docker-compose.gpu.yaml up
services:
  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=llm_user
      - POSTGRES_PASSWORD=llm_password
      - POSTGRES_DB=litellm_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  ollama:
    build:
      context: .
      dockerfile: ollama.Dockerfile
    # No host port mapping: litellm reaches this container over Compose's
    # internal network at http://ollama:11434 (see
    # config/model-templates/litellm.local-ollama.yaml) - nothing needs to
    # reach it from the host. Publishing 11434:11434 anyway just fails the
    # whole `docker compose up` outright if the host already has a native
    # Ollama install listening on its default port, which is a likely
    # combination for anyone trying this provider out.
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.1:8b}
      # Ollama's own default is 5m: it unloads the model from memory after 5
      # minutes idle, then pays the full load time again on the next
      # request. This container's only job is serving this one model to
      # this one team continuously for the life of the sprint, so unloading
      # between requests is pure overhead, not a resource saving - keep it
      # resident for the container's whole lifetime instead (-1 = never
      # unload; see https://github.com/ollama/ollama/blob/main/docs/faq.md).
      # Override in .env if you're sharing this Ollama instance for other,
      # bursty workloads where unloading between uses is actually desired.
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:--1}
    restart: unless-stopped
    # CPU-only by default. For NVIDIA GPU acceleration, merge in
    # docker-compose.gpu.yaml with an extra -f flag instead of hand-editing
    # this file - see docs/SETUP.md's "GPU Support" section for prerequisites
    # and how to verify the GPU was actually detected.
    # No CPU/RAM limits are set here deliberately: Docker only restricts a
    # container's resource use if you explicitly configure `deploy.resources
    # .limits`, which this file doesn't - by default this container can
    # already use as much CPU/RAM as Docker Desktop's own VM is allocated
    # (Settings -> Resources -> Advanced on the host), which is the actual
    # lever for "give Ollama more of the machine" - see docs/SETUP.md's
    # "Performance Tuning" section.

  litellm:
    image: docker.litellm.ai/berriai/litellm:main-stable
    ports:
      - "4000:4000"
    volumes:
      # LITELLM_CONFIG_PATH lets a caller (e.g. run_adk_eval.py) point this
      # at a dedicated config - eval/adk/litellm.local.yaml, pinned to a
      # fixed model - instead of whatever this developer's own .env last
      # configured via setup_llm.py, so eval runs are reproducible
      # regardless of the local dev environment's drift. Unset, this is
      # unchanged from before.
      - ${LITELLM_CONFIG_PATH:-./config/model-templates/litellm.local-ollama.yaml}:/app/config.yaml:ro
    environment:
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      - DATABASE_URL=${DATABASE_URL}
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    depends_on:
      - db
      - ollama
    restart: unless-stopped

  agent:
    build:
      context: .
      dockerfile: agent.Dockerfile
    ports:
      # ADK web frontend (only listens when AGENT_MODE=web, the default)
      - "8000:8000"
    volumes:
      # Mount the agent's source code as read-only
      - ./agents:/app/agents:ro
      - ./spec-templates:/app/spec-templates:ro
      - ./eval:/app/eval:ro
      # GH issue #156: see docker-compose.yaml's identical entry - `adk
      # eval` writes its own local run-history bookkeeping under
      # eval/adk/agent/scrum_team/.adk, which the read-only mount above
      # blocks ("Read-only file system").
      - adk_eval_history:/app/eval/adk/agent/scrum_team/.adk
      # Mount the state repository as read-write
      - type: bind
        source: ${STATE_REPO_PATH}
        target: /app/state_repo
      # Mount the sessions directory to persist conversation history
      - ./sessions:/app/sessions
      # Scratch space for the team-performance eval harness (run_eval.py /
      # run_eval_analysis.py) to write its clone + report where the host
      # (and CI's artifact-upload step) can read them back.
      - ./eval-output:/app/eval-output
    environment:
      - AGENT_MODE=${AGENT_MODE:-web}
      - STATE_REPO_PATH=${STATE_REPO_PATH}
      - INTERNAL_STATE_REPO_PATH=/app/state_repo
      - LITELLM_PROXY_API_BASE=http://litellm:4000
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      - LITELLM_PROXY_API_KEY=${LITELLM_PROXY_API_KEY}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - GITHUB_REPO_URL=${GITHUB_REPO_URL}
      # GH issue #82: Compose prints a "variable is not set" warning for any
      # bare ${VAR} reference left unset in .env, even when the code being
      # run already has a perfectly good default for it (get_interaction_level(),
      # _default_push_branch(), etc.) - inline `:-default` here matches those
      # same code-side defaults exactly, so the warning only fires for a var
      # that's genuinely required with no safe fallback.
      - GITHUB_REPO_BRANCH=${GITHUB_REPO_BRANCH:-main}
      - GITHUB_APP_ID=${GITHUB_APP_ID}
      - GITHUB_APP_PRIVATE_KEY=${GITHUB_APP_PRIVATE_KEY}
      - GITHUB_APP_INSTALLATION_ID=${GITHUB_APP_INSTALLATION_ID}
      - SPRINT_TOKEN_BUDGET=${SPRINT_TOKEN_BUDGET:-1000000}
      # TOTAL_USD_BUDGET is the canonical name (GH issue #81) - not actually
      # meaningful in local mode (see LLM_LOCAL_PROVIDER below), but still
      # passed through for consistency; SPRINT_USD_BUDGET is kept alongside
      # it so an existing .env using the older name keeps working via
      # get_env_with_deprecated_fallback. The `:-` (empty, not a real value)
      # on both is deliberate (GH issue #82): get_env_with_deprecated_fallback
      # needs to see each one genuinely absent (empty string, falsy) to know
      # to check the other - a real inline default here would inject a value
      # into TOTAL_USD_BUDGET even when only the deprecated name was actually
      # configured, permanently hiding it. This empty default exists purely
      # to silence Compose's own warning, not to change what value is used.
      - TOTAL_USD_BUDGET=${TOTAL_USD_BUDGET:-}
      - SPRINT_USD_BUDGET=${SPRINT_USD_BUDGET:-}
      - PROCESS_OVERHEAD_PERCENTAGE=${PROCESS_OVERHEAD_PERCENTAGE:-10.0}
      # Per-sprint config for agents/scrum_team/scripts/run_eval.py - see
      # .env.example's "Eval Harness Budget Configuration" section. No inline
      # default here (unlike the vars above) - run_eval.py's own
      # parser.error() deliberately requires these explicitly when the eval
      # harness actually runs, rather than silently falling back to a value
      # calibrated for a different purpose.
      - EVAL_SPRINT_TOKEN_BUDGET=${EVAL_SPRINT_TOKEN_BUDGET}
      # Same deprecated-name pair as TOTAL_USD_BUDGET/SPRINT_USD_BUDGET above -
      # `:-` (empty) only, not a real default, so run_eval.py's own
      # get_env_with_deprecated_fallback still sees each one genuinely absent.
      - EVAL_USD_BUDGET_PER_SPRINT=${EVAL_USD_BUDGET_PER_SPRINT:-}
      - EVAL_SPRINT_USD_BUDGET=${EVAL_SPRINT_USD_BUDGET:-}
      - SESSION_ID=${SESSION_ID:-my-sprint}
      # GH issue #125: see docker-compose.yaml's identical entry - the
      # commit of this Horseless Carriage checkout that produced an eval
      # run, computed on the host and passed through since `.git` is
      # excluded from the agent image's build context.
      - HC_COMMIT_SHA=${HC_COMMIT_SHA:-}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - GIT_USER_NAME=${GIT_USER_NAME}
      - GIT_USER_EMAIL=${GIT_USER_EMAIL}
      # GH issue #75: self-hosted Ollama models have no real per-token price
      # behind them, so LiteLLM's spend tracking for them is always ~$0 -
      # tells check_cost_budget_callback to skip the meaningless remote USD
      # check and rely on the local token budget instead. See docs/BUDGET.md.
      - LLM_LOCAL_PROVIDER=true
      # GH issue #76: Docker Compose only passes variables explicitly listed
      # here into the container - it does NOT forward the rest of the host's
      # .env automatically, however plausible that might look. These three
      # were configurable in .env/setup_llm.py but silently never reached
      # the agent process, always reading back as unset/default regardless
      # of what was actually configured.
      - INTERACTION_LEVEL=${INTERACTION_LEVEL:-Product}
      - GITHUB_DEVELOP_BRANCH=${GITHUB_DEVELOP_BRANCH:-develop}
      - NOTIFICATION_PLUGINS=${NOTIFICATION_PLUGINS:-console}
      - TRANSCRIPT_MAX_ENTRIES=${TRANSCRIPT_MAX_ENTRIES:-200}
      - TARGET_STORIES_PER_SPRINT=${TARGET_STORIES_PER_SPRINT:-3}
      - READY_BACKLOG_SPRINTS_TARGET=${READY_BACKLOG_SPRINTS_TARGET:-2}
      - SPRINT_CLOSEOUT_GRACE_PERCENT=${SPRINT_CLOSEOUT_GRACE_PERCENT:-5.0}
    depends_on:
      - litellm
    # Keep the container running and allow for interactive sessions
    stdin_open: true
    tty: true
    command: ["/bin/bash", "/app/agents/scrum_team/scripts/run_agent.sh"]

volumes:
  postgres_data:
  ollama_data:
  adk_eval_history:

# Fully local stack: extends docker-compose.yaml's db + litellm + agent setup
# with a self-hosted Ollama container, so every model call is served locally
# instead of by a commercial API. No OPENAI_API_KEY / ANTHROPIC_API_KEY /
# GOOGLE_API_KEY required - see .env.local.example.
#
# Run standalone (do not combine with docker-compose.yaml - the litellm
# service targets a different config file):
#   cp .env.local.example .env   # or edit your existing .env
#   docker compose -f docker-compose.local.yaml up
# For NVIDIA GPU acceleration, merge in docker-compose.gpu.yaml instead of
# hand-editing this file (see docs/SETUP.md's "GPU Support" section):
#   docker compose -f docker-compose.local.yaml -f docker-compose.gpu.yaml up
services:
  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=llm_user
      - POSTGRES_PASSWORD=llm_password
      - POSTGRES_DB=litellm_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  ollama:
    build:
      context: .
      dockerfile: ollama.Dockerfile
    # No host port mapping: litellm reaches this container over Compose's
    # internal network at http://ollama:11434 (see
    # config/model-templates/litellm.local-ollama.yaml) - nothing needs to
    # reach it from the host. Publishing 11434:11434 anyway just fails the
    # whole `docker compose up` outright if the host already has a native
    # Ollama install listening on its default port, which is a likely
    # combination for anyone trying this provider out.
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.1:8b}
    restart: unless-stopped
    # CPU-only by default. For NVIDIA GPU acceleration, merge in
    # docker-compose.gpu.yaml with an extra -f flag instead of hand-editing
    # this file - see docs/SETUP.md's "GPU Support" section for prerequisites
    # and how to verify the GPU was actually detected.

  litellm:
    image: docker.litellm.ai/berriai/litellm:main-stable
    ports:
      - "4000:4000"
    volumes:
      - ./config/model-templates/litellm.local-ollama.yaml:/app/config.yaml:ro
    environment:
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      - DATABASE_URL=${DATABASE_URL}
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    depends_on:
      - db
      - ollama
    restart: unless-stopped

  agent:
    build:
      context: .
      dockerfile: agent.Dockerfile
    ports:
      # ADK web frontend (only listens when AGENT_MODE=web, the default)
      - "8000:8000"
    volumes:
      # Mount the agent's source code as read-only
      - ./agents:/app/agents:ro
      - ./spec-templates:/app/spec-templates:ro
      - ./eval:/app/eval:ro
      # Mount the state repository as read-write
      - type: bind
        source: ${STATE_REPO_PATH}
        target: /app/state_repo
      # Mount the sessions directory to persist conversation history
      - ./sessions:/app/sessions
      # Scratch space for the team-performance eval harness (run_eval.py /
      # run_eval_analysis.py) to write its clone + report where the host
      # (and CI's artifact-upload step) can read them back.
      - ./eval-output:/app/eval-output
    environment:
      - AGENT_MODE=${AGENT_MODE:-web}
      - STATE_REPO_PATH=${STATE_REPO_PATH}
      - INTERNAL_STATE_REPO_PATH=/app/state_repo
      - LITELLM_PROXY_API_BASE=http://litellm:4000
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      - LITELLM_PROXY_API_KEY=${LITELLM_PROXY_API_KEY}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - GITHUB_REPO_URL=${GITHUB_REPO_URL}
      - GITHUB_REPO_BRANCH=${GITHUB_REPO_BRANCH}
      - GITHUB_APP_ID=${GITHUB_APP_ID}
      - GITHUB_APP_PRIVATE_KEY=${GITHUB_APP_PRIVATE_KEY}
      - GITHUB_APP_INSTALLATION_ID=${GITHUB_APP_INSTALLATION_ID}
      - SPRINT_TOKEN_BUDGET=${SPRINT_TOKEN_BUDGET}
      - SPRINT_USD_BUDGET=${SPRINT_USD_BUDGET}
      - PROCESS_OVERHEAD_PERCENTAGE=${PROCESS_OVERHEAD_PERCENTAGE}
      # Per-sprint config for agents/scrum_team/scripts/run_eval.py - see
      # .env.example's "Eval Harness Budget Configuration" section.
      - EVAL_SPRINT_TOKEN_BUDGET=${EVAL_SPRINT_TOKEN_BUDGET}
      - EVAL_SPRINT_USD_BUDGET=${EVAL_SPRINT_USD_BUDGET}
      - SESSION_ID=${SESSION_ID}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - GIT_USER_NAME=${GIT_USER_NAME}
      - GIT_USER_EMAIL=${GIT_USER_EMAIL}
    depends_on:
      - litellm
    # Keep the container running and allow for interactive sessions
    stdin_open: true
    tty: true
    command: ["/bin/bash", "/app/agents/scrum_team/scripts/run_agent.sh"]

volumes:
  postgres_data:
  ollama_data:
